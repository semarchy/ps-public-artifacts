# azure-pipelines.yml
# -----------------------------------------------------------------------------
# Mirror the Semarchy Data Platform Helm chart + all its images into a target
# Artifactory (or any OCI) registry, by driving mirror-semarchy-chart.sh.
#
# Runs manually (trigger: none). At queue time you pick the chart version and
# the target repository; everything else has defaults.
#
# One-time setup in the Azure DevOps project:
#   Pipelines > Library > + Variable group  ->  name it "semarchy-mirror-creds"
#   Add these variables and mark each as SECRET (padlock):
#     SRC_HELM_USER   Harbor user for registry.na.semarchy.net
#     SRC_HELM_KEY    Harbor password/token for the source
#     TGT_HELM_USER   User for the target registry
#     TGT_HELM_KEY    Password/token for the target registry
#   Then: Pipeline > Edit > link the "semarchy-mirror-creds" variable group.
#
# The mirror-semarchy-chart.sh script must be committed at the repo root (adjust
# scriptPath below if you keep it elsewhere).
# -----------------------------------------------------------------------------

trigger: none          # manual runs only
pr: none

parameters:
  - name: chartVersion
    displayName: 'Chart version to mirror (e.g. 1.3.0)'
    type: string
  - name: targetRepo
    displayName: 'Target registry repo (host/path, e.g. artifactory.corp.com/semarchy)'
    type: string
  - name: sourceRegistry
    displayName: 'Source image registry host'
    type: string
    default: 'registry.na.semarchy.net'
  - name: dryRun
    displayName: 'Dry run (plan only, copy nothing)'
    type: boolean
    default: false

variables:
  - group: semarchy-mirror-creds          # provides SRC_HELM_USER/KEY, TGT_HELM_USER/KEY (secret)
  - name: scriptPath
    value: 'mirror-semarchy-chart.sh'
  # Give helm and skopeo a shared, writable auth file so both logins land in one
  # place and skopeo can reuse the helm credentials.
  - name: HELM_REGISTRY_CONFIG
    value: '$(Agent.TempDirectory)/helm-registry-config.json'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: HelmInstaller@1
    displayName: 'Install Helm'
    inputs:
      helmVersionToInstall: 'latest'

  - script: |
      set -euo pipefail
      if ! command -v skopeo >/dev/null 2>&1; then
        echo "Installing skopeo..."
        sudo apt-get update
        sudo apt-get install -y skopeo
      fi
      skopeo --version
      helm version --short
    displayName: 'Install / verify skopeo'

  - script: |
      set -euo pipefail
      # Ensure the shared auth file exists (helm writes to HELM_REGISTRY_CONFIG).
      mkdir -p "$(dirname "$HELM_REGISTRY_CONFIG")"
      : > "$HELM_REGISTRY_CONFIG"

      echo "Logging in to source registry: ${SOURCE_REGISTRY}"
      echo "$SRC_HELM_KEY" | helm registry login "${SOURCE_REGISTRY}" \
        --username "$SRC_HELM_USER" --password-stdin

      # Derive the target host (strip any path) for the docker/helm login.
      TARGET_HOST="${TARGET_REPO%%/*}"
      echo "Logging in to target registry: ${TARGET_HOST}"
      echo "$TGT_HELM_KEY" | helm registry login "${TARGET_HOST}" \
        --username "$TGT_HELM_USER" --password-stdin
    displayName: 'Helm registry login (source + target)'
    env:
      SOURCE_REGISTRY: ${{ parameters.sourceRegistry }}
      TARGET_REPO: ${{ parameters.targetRepo }}
      SRC_HELM_USER: $(SRC_HELM_USER)
      SRC_HELM_KEY: $(SRC_HELM_KEY)
      TGT_HELM_USER: $(TGT_HELM_USER)
      TGT_HELM_KEY: $(TGT_HELM_KEY)

  - script: |
      set -euo pipefail
      chmod +x "$(scriptPath)"
      DRY_FLAG=""
      if [ "${DRY_RUN}" = "True" ] || [ "${DRY_RUN}" = "true" ]; then
        DRY_FLAG="--dry-run"
      fi
      ./$(scriptPath) \
        --target-repo   "${TARGET_REPO}" \
        --chart-version "${CHART_VERSION}" \
        --source-registry "${SOURCE_REGISTRY}" \
        --authfile "${HELM_REGISTRY_CONFIG}" \
        ${DRY_FLAG}
    displayName: 'Mirror chart + images'
    env:
      TARGET_REPO: ${{ parameters.targetRepo }}
      CHART_VERSION: ${{ parameters.chartVersion }}
      SOURCE_REGISTRY: ${{ parameters.sourceRegistry }}
      DRY_RUN: ${{ parameters.dryRun }}
