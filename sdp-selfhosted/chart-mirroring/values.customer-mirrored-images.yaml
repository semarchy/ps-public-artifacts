## =============================================================================
## Semarchy Data Platform — customer values.yaml (local registry / air-gapped)
##
## Validated against chart: semarchy-data-platform 1.4.2
##
## Based on the official Azure starter values:
##   https://docs.semarchy.com/assets/files/values.azure-*.yaml
##
## PLUS a "Local registry / image mirroring" section (see the clearly marked
## block below) that repoints EVERY container image from the Semarchy source
## registry (registry.na.semarchy.net/semarchy-release/...) to a local
## Artifactory mirror, so pods pull only from the local registry.
##
## Assumes images were mirrored preserving their path, e.g. with
## mirror-semarchy-chart.sh:
##   registry.na.semarchy.net/semarchy-release/docker-dm:1.17.1
##     ->  <YOUR_LOCAL_REGISTRY>/semarchy-release/docker-dm:1.17.1
##
## Replace every <YOUR_...> placeholder before use.
## =============================================================================

## ------------------------------------------------------------------ Global ---
global:
    # `global.domain` is the main DNS domain used for all ingress hosts and for app access.
    # When performing a local installation, declare this domain in /etc/hosts as well.
    # Example: platform.company.net
    domain: '<YOUR_GLOBAL_DOMAIN>'
    # Protocol used for external URLs
    externalProtocol: 'https'
    license:
        # Your license key for the Semarchy Data Platform
        body: '<YOUR_LICENSE_KEY_HERE>'
    smartReload:
        enabled: false
        reloader:
            # Keep consistent with smartReload.enabled. The chart default is
            # install: true, so Reloader is still deployed unless this is false.
            # If you set it to true, keep the "HARD-CODED IMAGE OVERRIDE" for
            # reloader at the bottom of this file.
            install: false
    searchEngine:
        type: elasticsearch

    ## =========================================================================
    ## >>> LOCAL REGISTRY / IMAGE MIRRORING <<<
    ## -------------------------------------------------------------------------
    ## `global.image.registry` is prepended to every Semarchy and mirrored
    ## third-party image in the chart and its sub-charts, including
    ## dm.secretManager (since chart 1.4.1) and the CA truststore builder.
    ## Point it at your local registry BASE (host + any path prefix) where the
    ## mirror lives.
    ##
    ## Set it to the same base you passed to the mirror script as --target-repo.
    ## Examples:
    ##   registry: 'artifactory.company.com/semarchy'
    ##   registry: 'myregistry.azurecr.io'          # if mirrored to ACR root
    ##
    ## Keep `repository: semarchy-release`. Several image paths in the chart
    ## hard-code the `semarchy-release` segment (Keycloak, keycloak-config-cli,
    ## Envoy, truststore builder, application images), so changing this value
    ## only moves sdp-infra-tools and well-known-service and breaks the line-up.
    ##
    ## In chart 1.4.1+ this single override covers 19 of the 20 images. The only
    ## image that still hard-codes the source registry is Reloader — see
    ## "HARD-CODED IMAGE OVERRIDE" at the bottom of this file.
    ## =========================================================================
    image:
        registry: '<YOUR_LOCAL_REGISTRY>'      # e.g. artifactory.company.com/semarchy
        repository: 'semarchy-release'

    ## Credentials to pull from the local registry. This REPLACES the chart
    ## default (semarchy-harbor). Create this secret in the release namespace
    ## beforehand, e.g.:
    ##   kubectl create secret docker-registry local-registry \
    ##     --docker-server=<YOUR_LOCAL_REGISTRY_HOST> \
    ##     --docker-username=<USER> --docker-password=<TOKEN> -n <NAMESPACE>
    imagePullSecrets:
        - name: '<YOUR_LOCAL_REGISTRY_PULL_SECRET>'   # e.g. local-registry

    ## Only if you use global.caCert.enabled=true (private / self-signed CA):
    ## the truststore builder image defaults to
    ##   {{ .Values.global.image.registry }}/semarchy-release/mirror/ubi9/openjdk-21-runtime:1.23
    ## and is therefore repointed automatically. If you override
    ## global.caCert.initImage or global.caCert.truststore.builderImage, make
    ## sure those images exist in your local registry too.

## ------------------------------------------------------------ Tenant setup ---
tenant-settings:
    isSelfHosted: true
    user_creation:
        # Email address of the first admin user
        email: '<YOUR_EMAIL_ADDRESS>'
        # Given name of the first admin user
        firstname: '<YOUR_FIRSTNAME>'
        # Family name of the first admin user
        lastname: '<YOUR_LASTNAME>'

## -------------------------------------------------------------- Semarchy IAM -
semarchy-iam:
    keycloak:
        config:
            spi:
                # Azure Event Hubs uses PLAIN mechanism (default is SCRAM-SHA-512)
                eventsListenerKafkaEventListenerPropertiesSaslMechanism: 'PLAIN'
        ingresses:
            ingress:
                - name: sdp-keycloak
                  # Class name of the ingress provider. Example: "nginx" or "traefik"
                  className: '<YOUR_INGRESS_CLASS_NAME>'
                  tls:
                      secretName: <TLS_CERTIFICATE_ROOT>
                      hostname: '<YOUR_GLOBAL_DOMAIN>'

## -------------------------------------------------------------- Log Explorer -
log-explorer:
    ingress:
        className: '<YOUR_INGRESS_CLASS_NAME>'
        hosts:
            - host: 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
              paths:
                - path: /log-explorer
                  pathType: ImplementationSpecific
        tls:
            - secretName: <TLS_CERTIFICATE_SUBDOMAIN>
              hosts:
                  - 'selfhosted.<YOUR_GLOBAL_DOMAIN>'

## -------------------------------------------------------------- User Profile -
user-profile:
    ingress:
        className: '<YOUR_INGRESS_CLASS_NAME>'
        hosts:
            - host: 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
              paths:
                - path: /user-profile
                  pathType: ImplementationSpecific
        tls:
            - secretName: <TLS_CERTIFICATE_SUBDOMAIN>
              hosts:
                  - 'selfhosted.<YOUR_GLOBAL_DOMAIN>'

## ---------------------------------------------------------------- Site Admin -
site-admin:
    ingress:
        className: '<YOUR_INGRESS_CLASS_NAME>'
        hosts:
            - host: 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
              paths:
                - path: /site-admin
                  pathType: ImplementationSpecific
        tls:
            - secretName: <TLS_CERTIFICATE_SUBDOMAIN>
              hosts:
                  - 'selfhosted.<YOUR_GLOBAL_DOMAIN>'

## ------------------------------------------------------------------- Welcome -
welcome:
    ingress:
        className: '<YOUR_INGRESS_CLASS_NAME>'
        hosts:
            - host: 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
              paths:
                - path: /
                  pathType: ImplementationSpecific
        tls:
            - secretName: <TLS_CERTIFICATE_SUBDOMAIN>
              hosts:
                  - 'selfhosted.<YOUR_GLOBAL_DOMAIN>'

## ---------------------------------------------------------- Data Management --
dm:
    kafka:
        # Azure Event Hubs uses PLAIN mechanism (default is SCRAM-SHA-512)
        userEventSaslMechanism: PLAIN

    ## NOTE — dm.secretManager (chart 1.4.1 and later):
    ## The image is now rendered as
    ##   {{ global.image.registry }}/{{ dm.secretManager.image.repository }}:<tag>
    ## with repository = 'semarchy-release/docker-secret-manager'.
    ## Do NOT override dm.secretManager.image.repository with a full path any
    ## more: it would be prefixed twice (<REG>/<REG>/semarchy-release/...) and
    ## the pod would end in ImagePullBackOff.
    ##
    ## Only for chart <= 1.4.0, uncomment the override below:
    # secretManager:
    #     image:
    #         repository: '<YOUR_LOCAL_REGISTRY>/semarchy-release/docker-secret-manager'

    core:
        ingress:
            # Class name of the ingress provider. Example: "nginx" or "traefik"
            className: '<YOUR_INGRESS_CLASS_NAME>'
            hosts:
                # Hostname for the Data Management core service. Example: selfhosted.platform.company.net
                - host: 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
                  paths:
                    - path: /dm
                      pathType: ImplementationSpecific
            tls:
                - secretName: <TLS_CERTIFICATE_SUBDOMAIN>
                  hosts:
                      - 'selfhosted.<YOUR_GLOBAL_DOMAIN>'
        active:
            livenessProbe:
                # Initial delay for liveness probe (seconds)
                initialDelaySeconds: 100
            readinessProbe:
                # Initial delay for readiness probe (seconds)
                initialDelaySeconds: 100
        passive:
            service:
                annotations:
                    # You need annotations for sticky sessions, Example annotations with "traefik".
                    traefik.ingress.kubernetes.io/service.sticky.cookie: 'true'
                    traefik.ingress.kubernetes.io/service.sticky.cookie.name: 'route'
                    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: 'true'
                    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: 'true'

## ------------------------------------------------------------------ Reloader -
## === HARD-CODED IMAGE OVERRIDE (only one left as of chart 1.4.2) =============
## The reloader sub-chart (stakater, upstream) cannot build its image from
## global values, so the parent chart hard-codes
##   registry.na.semarchy.net/semarchy-release/mirror/stakater/reloader
## Repoint it to the local mirror. Harmless when
## global.smartReload.reloader.install is false; required when it is true.
## =============================================================================
reloader:
    image:
        repository: '<YOUR_LOCAL_REGISTRY>/semarchy-release/mirror/stakater/reloader'
